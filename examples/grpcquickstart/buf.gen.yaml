# Code generation for the example's protobuf schema. Both plugins are run at
# pinned versions through "go run", so regeneration needs only the Go toolchain
# and the buf version pinned in main.go's go:generate line -- no globally
# installed protoc plugin decides what the committed code looks like.
version: v2
plugins:
  - local: ["go", "run", "google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11"]
    out: internal/gen
    opt: paths=source_relative
  - local: ["go", "run", "google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2"]
    out: internal/gen
    opt: paths=source_relative
