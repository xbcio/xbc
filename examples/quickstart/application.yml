# Quickstart keeps the default stack self-contained: it needs no database,
# Redis, broker, object store, or cluster peers. Optional infrastructure
# plugins can be added later by selecting their Bundle and adding one
# plugins.<key> configuration section.
#
# XBC searches application.yml and configs/application.yml in that order, or
# accepts --config explicitly. YAML values do not expand ${VAR}; environment
# overrides use the complete path, for example XBC_WEB_ADDR. The environment is
# a full configuration layer above this file, so a section can exist by
# environment alone; multi-instance sections insert the instance name, as in
# XBC_PLUGINS_GORM_PRIMARY_DSN. Every key must be owned by a selected plugin or
# by the framework, so a misspelled section fails startup by name.
#
# Run `go run ./examples/quickstart doctor --config <path>` to see the resolved
# plugin graph, instances, configuration sources, and disable reasons without
# starting anything.

xbc:
  # This process's identity: the token that names it in the placement line at
  # startup and in whatever an operator correlates a log, a metric and a doctor
  # report by. Left empty, the runtime derives one -- hostname, boot second, and
  # a short random suffix, as in host-7-1758091200-9f3c1a2b -- so two processes
  # on one host are already distinguishable with no deployment input. Set it
  # when the supervisor already knows which slot this process is, and the value
  # is then used exactly as written and survives a restart. YAML does not expand
  # ${VAR}, so a per-process value comes from the environment:
  # XBC_INSTANCE_ID=orders-3. Whitespace in it is a startup error, because it is
  # presented as one token wherever it is printed.
  instance_id: ""
  # One budget covers cancellation, managed-task join, and reverse-order plugin
  # Stop. The pre-stop phase below runs before all of that and is accounted
  # separately, so the worst case for one stop is the two added together.
  shutdown_timeout: 15s
  # PreStop retracts a value's externally visible participation while the process
  # is still fully alive -- releasing a placement lease is a real remote call --
  # so it gets its own budget rather than a share of the one above. It is per
  # phase, not per plugin. This composition releases nothing, so the value only
  # demonstrates the key.
  pre_stop_timeout: 2s
  # While startup is unfinished, report every 30s which phase it is in and which
  # plugin still holds it. Reporting only: it never aborts or times out a
  # startup. Raise it, or set 0s to switch it off, when migrations legitimately
  # run for minutes.
  slow_startup_after: 30s

  # Process-level resource knobs. They live here rather than in a plugin because
  # each one is process-global: a plugin that set them would be tuning the whole
  # process from inside one component, and an architecture guard fails the build
  # for one that tries. The effective values, and where each came from, are
  # logged once at startup and printed by the doctor subcommand.
  runtime:
    # auto derives the processor count from this container's cgroup CPU quota
    # rather than from the host's core count -- the difference between a
    # 4-core-quota container starting 4 workers and starting 64. Where no quota
    # is derivable, as on a bare-metal host, auto leaves GOMAXPROCS at the Go
    # default and says so on the startup line. A positive integer sets it
    # outright; 0 leaves it untouched.
    max_procs: auto
    # A byte count, or a percentage of this container's memory limit such as
    # "75%". A percentage needs a derivable limit and is a startup error rather
    # than a silent no-op without one. 0, the default, sets no limit.
    memory_limit: 0
    # 0 leaves Go's default of 100 in place. A lower value collects more often
    # and trades CPU for a smaller heap, which is usually the right trade in a
    # memory-constrained container and the wrong one on a latency budget.
    gc_percent: 0

log:
  level: info
  console:
    enabled: true
    format: console

# Web is a transport runtime, so its configuration lives at the root.
web:
  addr: ":8080"
  # Plugin routes are relative to this prefix. Probe and documentation URLs
  # therefore become /api/v1/healthz, /api/v1/readyz, and /api/v1/docs.
  base_path: "/api/v1"
  # Process-wide admission ceiling: how many requests this process serves at
  # once. Beyond it a request is refused with 503 and Retry-After before any
  # handler runs, rather than queued -- a queue in front of a saturated process
  # only turns a fast refusal into a slow one. It is deliberately not
  # configurable per route or per plugin: a per-plugin ceiling cannot bound the
  # sum an instance accepts, which is the quantity that decides whether the
  # instance survives its traffic. 0, the default, derives the ceiling from
  # GOMAXPROCS, so it follows xbc.runtime.max_procs above.
  max_in_flight: 0
  shutdown:
    # Default is 0s. Keep the listener up after cancellation so /readyz can
    # return 503 before HTTP draining begins. This consumes the shared shutdown
    # budget, still accepts ordinary traffic, and is not acknowledgement that a
    # load balancer has withdrawn the instance.
    pre_drain_delay: 2s
  read_timeout: 10s
  read_header_timeout: 5s
  write_timeout: 30s
  idle_timeout: 60s
  max_header_bytes: 1048576
  max_request_body_bytes: 10485760
  max_multipart_memory: 8388608
  # Keep this empty unless the application is behind a known reverse proxy.
  # Add only exact proxy IPs or CIDRs; arbitrary forwarded headers are ignored.
  trusted_proxies: []

  # Authentication policy: three-tier precedence model.
  #   Tier 1 — web.security.policies rules (highest, overrides route declarations)
  #   Tier 2 — route-level .Auth() declarations (e.g. Auth(web.Public()))
  #   Tier 3 — web.security.default (factory setting: deny; covers unclaimed routes)
  #
  # The quickstart has no authenticator, so only "permit" rules are valid here.
  # To switch a rule to "authenticate: [jwt]" you must first register a JWT
  # authenticator by selecting its Bundle; otherwise startup fails with
  # "requires authentication but no authenticator is registered", because the
  # route now needs authentication and none is available to perform it.
  security:
    default: deny
    policies:
      # Tier-1 rule: explicitly permit the documentation endpoints. These routes
      # already declare Auth(web.Public()) at tier 2, so this rule is redundant
      # in practice — it demonstrates that a tier-1 rule takes precedence and
      # appears as "application-rule" in the startup policy table.
      - match: "/api/v1/docs/**"
        permit: true

# This composition declares no workload, and that is why there is no
# `workloads:` block above. The workload root is declared only when at least one
# workload is declared in Go, so an always-present root would claim a prefix
# nothing beneath it answers for. Adding one here fails startup naming the
# unowned key:
#
#   xbc: configuration contains a key that no plugin or framework section owns
#     workloads
#     declared top-level sections: app, log, plugins, web, xbc
#
# A workload is declared in Go, where its Definitions and its cluster-level
# placement constraints live together:
#
#   var bundle = plugin.WorkloadOf(
#       "sast",
#       plugin.BundleOf(dispatcherDefinition, workerDefinition),
#       plugin.WithExclusiveProcess(),
#       plugin.WithReplicas(3),
#   )
#
# Once one exists, its section owns exactly what one process may decide about
# itself:
#
#   workloads:
#     sast:
#       # Hard veto. No placement source may override it, because excluding a
#       # process from a role outright is a deployment decision rather than a
#       # placement one.
#       enabled: true
#       # Managed tasks this process may run on behalf of the workload at once.
#       # 0 is unbounded.
#       max_goroutines: 0
#
# The workload's replicas and exclusivity are deliberately absent from YAML:
# they describe the cluster rather than one process, so a host that could
# reinterpret "how many replicas may run" would silently invalidate the
# placement every other process derived from the same declaration.
#
# `examples/workloads` is the runnable example of the whole surface: one binary,
# two workloads, one of them exclusive, and an unowned plugin that every role
# carries.

plugins:
  # The optional biz response plugin has no configuration section: selecting
  # biz.Bundle() is the complete opt-in for the success envelope and the
  # biz.onerror middleware. Web's outer error boundary has no section at all:
  # the server assembles it, so there is nothing here to configure or disable.

  # Outermost panic boundary; sensitive request data and panic values are not
  # included in its structured log record.
  recovery:
    stack: true

  requestid:
    header: "X-Request-ID"
    # Generate server-owned IDs instead of trusting arbitrary public clients.
    trust_incoming: false
    max_length: 128

  accesslog:
    request_id_header: "X-Request-ID"
    trust_proxy_headers: false
    skip_paths:
      - "/api/v1/healthz"
    slow_request: 500ms

  cors:
    # Change this to the exact browser origins used by the application.
    allow_origins:
      - "http://localhost:3000"
    allow_methods: [GET, POST, PUT, PATCH, DELETE, HEAD, OPTIONS]
    allow_headers: [Origin, Content-Type, Accept, Authorization]
    max_age: 12h

  securityheaders:
    content_type_nosniff: true
    frame_options: "DENY"
    hsts_enabled: true
    # HSTS is emitted only for HTTPS by default; forwarded headers are not
    # trusted, so running this local HTTP example cannot poison browser state.
    hsts_only_https: true
    hsts_trust_forwarded_proto: false

  gzip:
    min_length: 1024

  timeout:
    # Cooperative handler deadline; streaming and upgrade requests bypass it.
    duration: 15s

  health:
    # Per-check budget for every contributed probe. Endpoint paths belong to the
    # HTTP adapter below, because this section is the protocol-neutral
    # capability: a background-only service configures it with no adapter at all.
    timeout: 2s

  health-http:
    liveness_path: "/healthz"
    # Returns 503 after shutdown begins; web.shutdown.pre_drain_delay above
    # keeps it reachable before HTTP drain.
    readiness_path: "/readyz"
    # Do not expose dependency errors on public probes.
    detail_policy: never

  # API metadata and operations come from the generated docs package. This
  # section selects its swag registry instance and configures serving paths.
  swag:
    instance_name: "swagger"
    json_path: "/swagger.json"
    ui_path: "/docs"
    ui_enabled: true
