name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955b # v4.3.0

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.work
          # Hash every independently publishable workspace module. The
          # architecture test fails if a new go.mod is omitted from go.work.
          cache-dependency-path: |
            go.sum
            **/go.sum

      - name: Check all workspace modules
        run: make check
